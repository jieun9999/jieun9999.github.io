<svg xmlns="http://www.w3.org/2000/svg" width="420" height="820" viewBox="0 0 420 820" role="img" aria-labelledby="title desc">
<title id="title">Cutover validation gates</title>
<desc id="desc">Validate the new environment → Stop writes from the old apps and workers → Make and compare the final PostgreSQL and Redis copies → Start the new apps and check basic functions → Switch Cloudflare entry point and resume writes. After writes reach the new database, changing the address back alone cannot restore the previous state.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L7 5 L2 9" fill="none" stroke="#737373" stroke-width="2"/></marker></defs>
<rect width="420" height="820" fill="#FFFFFF"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#202124">
<rect width="420" height="66" fill="#172B4D"/>
<text x="20" y="42" fill="#FFFFFF" font-size="25" font-weight="700">Cutover validation gates</text>
<text x="210" y="103" text-anchor="middle" font-size="21">Compare data and test before cutover</text>
<rect x="20" y="126" width="380" height="82" rx="4" fill="#F5F5F5" stroke="#D4D4D4"/>
<text x="210" y="159" text-anchor="middle" font-size="24" font-weight="600">Validate the new environment</text>
<text x="210" y="188" text-anchor="middle" font-size="21">Test restore, access and functions</text>
<path d="M210 212 V228" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="234" width="380" height="82" rx="4" fill="#F5F5F5" stroke="#D4D4D4"/>
<text x="210" y="267" text-anchor="middle" font-size="24" font-weight="600">Stop writes in the old service</text>
<text x="210" y="296" text-anchor="middle" font-size="21">Stop apps, workers, scheduled jobs</text>
<path d="M210 320 V336" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="342" width="380" height="82" rx="4" fill="#F5F5F5" stroke="#D4D4D4"/>
<text x="210" y="375" text-anchor="middle" font-size="24" font-weight="600">Final PostgreSQL · Redis copy</text>
<text x="210" y="404" text-anchor="middle" font-size="21">Match tables, row counts and keys</text>
<path d="M210 428 V444" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="450" width="380" height="82" rx="4" fill="#F5F5F5" stroke="#D4D4D4"/>
<text x="210" y="483" text-anchor="middle" font-size="24" font-weight="600">Start and check the new apps</text>
<text x="210" y="512" text-anchor="middle" font-size="21">Check data and basic functions</text>
<path d="M210 536 V552" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="558" width="380" height="82" rx="4" fill="#F5F5F5" stroke="#D4D4D4"/>
<text x="210" y="591" text-anchor="middle" font-size="24" font-weight="600">Switch Cloudflare entry point</text>
<text x="210" y="620" text-anchor="middle" font-size="21">Resume user writes in the new setup</text>
<rect x="20" y="676" width="380" height="122" rx="4" fill="#FFF7DB" stroke="#D4D4D4"/>
<text x="40" y="708" font-size="22" font-weight="700">Rollback boundary</text>
<text x="40" y="742" font-size="22">After writes reach the new DB,</text>
<text x="40" y="774" font-size="22">DNS rollback alone is not enough.</text>
</g></svg>

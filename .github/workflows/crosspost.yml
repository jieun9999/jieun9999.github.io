name: Crosspost EN posts to Hashnode

on:
  # 영문 글이 push될 때만 (crosspost:true 글만 실제 발행됨 — 스크립트가 필터)
  push:
    branches: [main]
    paths:
      - 'src/content/blog/en/**.md'
  # 수동 전체 동기화도 가능
  workflow_dispatch:

# hashnodeId 되써넣기 커밋을 위해 write 권한
permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이전 커밋과 diff 위해 전체 히스토리

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine changed EN posts
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 첫 push거나 수동 실행 → crosspost 영문 전체(스크립트가 파일 인자 없으면 전체 처리)
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "run=all" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'src/content/blog/en/*.md' | tr '\n' ' ')
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            if [ -z "$(echo "$FILES" | tr -d ' ')" ]; then echo "run=none" >> "$GITHUB_OUTPUT"; else echo "run=some" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Crosspost to Hashnode
        if: steps.changed.outputs.run != 'none'
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
        run: |
          if [ -z "$HASHNODE_PAT" ]; then
            echo "::warning::HASHNODE_PAT secret 미설정 — 교차발행 건너뜀. 시크릿 추가 후 재실행하세요."
            exit 0
          fi
          node scripts/crosspost-hashnode.mjs ${{ steps.changed.outputs.files }}

      - name: Commit hashnodeId write-backs
        if: steps.changed.outputs.run != 'none'
        run: |
          if [ -n "$(git status --porcelain 'src/content/blog/en/*.md')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/blog/en/*.md
            git commit -m "chore: sync Hashnode post ids [skip ci]"
            git push
          else
            echo "No hashnodeId changes to commit."
          fi
